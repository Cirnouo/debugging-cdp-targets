name: Temporary actual MCP Linux startup diagnostics

on:
    push:
        branches:
            - chore/codex-icons-readme-polish
        paths:
            - .github/workflows/linux-mcp-startup-probe.yml
            - tests/smoke/linux-mcp-startup-preload.ts
            - tests/smoke/linux-mcp-startup-support.ts
            - tests/linux-mcp-startup-preload.test.ts

permissions:
    contents: read

jobs:
    actual-mcp-startup:
        name: Temporary actual MCP Linux sample ${{ matrix.sample }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                sample: [1, 2]
        env:
            DCT_SMOKE_CHROME_EXECUTABLE: /opt/google/chrome/chrome
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Validate and audit lockfile before installation
                env:
                    PNPM_CONFIG_IGNORE_PNPMFILE: "true"
                    PNPM_CONFIG_CONFIG_DEPENDENCIES: "{}"
                run: node tooling/security/dist/check-security.mjs --phase lockfile --root .
            -   name: Install without dependency lifecycle scripts
                env:
                    PNPM_CONFIG_IGNORE_PNPMFILE: "true"
                    PNPM_CONFIG_CONFIG_DEPENDENCIES: "{}"
                run: pnpm install --frozen-lockfile --ignore-scripts
            -   name: Check full dependency trees and registry signatures
                env:
                    PNPM_CONFIG_IGNORE_PNPMFILE: "true"
                    PNPM_CONFIG_CONFIG_DEPENDENCIES: "{}"
                run: pnpm check:security
            -   name: Verify standalone security checker matches its source
                env:
                    PNPM_CONFIG_IGNORE_PNPMFILE: "true"
                    PNPM_CONFIG_CONFIG_DEPENDENCIES: "{}"
                run: pnpm check:security:build
            -   name: Install dependencies after supply-chain checks
                env:
                    PNPM_CONFIG_IGNORE_PNPMFILE: "true"
                    PNPM_CONFIG_CONFIG_DEPENDENCIES: "{}"
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Run unchanged MCP acceptance scripts with bounded observations
                shell: bash
                run: |
                    set -euo pipefail
                    evidence_dir="$RUNNER_TEMP/dct-linux-mcp-startup-${{ matrix.sample }}"
                    mkdir -- "$evidence_dir"
                    print_evidence() {
                        smoke_status=$?
                        trap - EXIT
                        set +e
                        printf 'Original acceptance exit status: %s\n' "$smoke_status"
                        if [[ -z "$(find "$evidence_dir" -maxdepth 3 -type f -name 'parent-*.events.jsonl' -size +0c -print -quit)" ]]; then
                            printf '[MISSING/INCOMPLETE: no nonempty parent preload event file]\n'
                        fi
                        if [[ -z "$(find "$evidence_dir" -maxdepth 3 -type f -name 'gateway-*.events.jsonl' -size +0c -print -quit)" ]]; then
                            printf '[MISSING/INCOMPLETE: no nonempty gateway preload event file]\n'
                        fi
                        for stream_name in stdout stderr; do
                            if [[ -z "$(find "$evidence_dir" -maxdepth 3 -type f -name "$stream_name.log" -print -quit)" ]]; then
                                printf '[MISSING/INCOMPLETE: no Chrome %s capture file]\n' "$stream_name"
                            fi
                        done
                        recent_files() {
                            find "$evidence_dir" -maxdepth 3 -type f -name "$1" -printf '%T@ %p\0' | sort -z -nr | cut -z -d ' ' -f 2-
                        }
                        latest_gateway="$(recent_files 'gateway-*.events.jsonl' | head -z -n 1)"
                        latest_stderr="$(recent_files 'stderr.log' | head -z -n 1)"
                        declare -A printed_files=()
                        file_count=0
                        byte_budget=131072
                        while IFS= read -r -d '' diagnostic_file; do
                            if [[ -z "$diagnostic_file" || "${printed_files[$diagnostic_file]:-}" == 1 ]]; then continue; fi
                            printed_files["$diagnostic_file"]=1
                            if (( file_count >= 16 )); then
                                printf '[TRUNCATED: additional evidence files omitted; limit 16]\n'
                                break
                            fi
                            if (( byte_budget <= 0 )); then
                                printf '[TRUNCATED: total evidence limit 131072 bytes reached]\n'
                                break
                            fi
                            file_count=$((file_count + 1))
                            file_size="$(stat -c %s -- "$diagnostic_file")"
                            if [[ ! "$file_size" =~ ^[0-9]+$ ]]; then
                                printf '[Evidence file unavailable: %s]\n' "$diagnostic_file"
                                continue
                            fi
                            byte_limit=32768
                            if (( byte_budget < byte_limit )); then byte_limit=$byte_budget; fi
                            if (( file_size < byte_limit )); then byte_limit=$file_size; fi
                            printf '\nEvidence: %s (%s bytes; tail %s bytes)\n' "$diagnostic_file" "$file_size" "$byte_limit"
                            if (( file_size > byte_limit )); then
                                printf '[TRUNCATED: preceding %s bytes omitted]\n' "$((file_size - byte_limit))"
                            fi
                            tail -c "$byte_limit" -- "$diagnostic_file"
                            printf '\n'
                            byte_budget=$((byte_budget - byte_limit))
                        done < <(
                            if [[ -n "$latest_gateway" ]]; then printf '%s\0' "$latest_gateway"; fi
                            if [[ -n "$latest_stderr" ]]; then printf '%s\0' "$latest_stderr"; fi
                            for pattern in '*.events.jsonl' 'stderr.log' 'stdout.log' 'xvfb-*.log'; do
                                recent_files "$pattern"
                            done
                        )
                        exit "$smoke_status"
                    }
                    trap print_evidence EXIT
                    test -x "$DCT_SMOKE_CHROME_EXECUTABLE"
                    command -v lsof
                    command -v getconf
                    command -v Xvfb
                    command -v xvfb-run
                    command -v xauth
                    preload_url="$(node --input-type=module -e 'import path from "node:path"; import { pathToFileURL } from "node:url"; const url = pathToFileURL(path.resolve("tests/smoke/linux-mcp-startup-preload.ts")); url.searchParams.set("directory", process.argv[1]); process.stdout.write(url.href);' "$evidence_dir")"
                    xvfb-run -a -e "$evidence_dir/xvfb-official.log" node --import "$preload_url" tests/smoke/official-server.ts
                    xvfb-run -a -e "$evidence_dir/xvfb-recovery.log" node --import "$preload_url" tests/smoke/entry-recovery.ts
