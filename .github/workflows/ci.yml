name: CI

on:
    push:
    pull_request:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize
            - edited
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    commit-messages:
        name: Commit messages
        runs-on: ubuntu-latest
        steps:
            -   name: Check out full history
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Validate commits and source branch
                run: pnpm check:commits

    quality:
        name: Quality
        runs-on: ubuntu-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Audit repository
                run: pnpm check:repo
            -   name: Check formatting
                run: pnpm format:check
            -   name: Lint JavaScript and JSON
                run: pnpm lint
            -   name: Check script syntax
                run: pnpm check:scripts
            -   name: Test with coverage floors
                run: pnpm test:coverage
            -   name: Verify distribution
                run: pnpm check:distribution

    windows-tests:
        name: Windows tests
        needs: quality
        runs-on: windows-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Run full Node test suite
                run: pnpm test
            -   name: Check JavaScript and both PowerShell parsers
                run: pnpm check:scripts
            -   name: Test from an arbitrary working directory
                shell: pwsh
                run: |
                    $repositoryRoot = (Resolve-Path .).Path
                    Push-Location $env:RUNNER_TEMP
                    try {
                        node --test "$repositoryRoot/tests/cdp-session.test.mjs"
                    }
                    finally {
                        Pop-Location
                    }
            -   name: Verify distribution
                run: pnpm check:distribution
