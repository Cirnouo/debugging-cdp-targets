name: CI

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize
            - edited
    workflow_dispatch:
        inputs:
            ubuntu-startup-study:
                description: Run the bounded Ubuntu first-start file-logging study (six fresh runners)
                type: boolean
                required: false
                default: false
            ubuntu-readahead-study:
                description: Run the bounded Ubuntu queue readahead study (six fresh runners)
                type: boolean
                required: false
                default: false
            ubuntu-first-start-assessment:
                description: Run the bounded current-version first-start assessment (six serial fresh runners)
                type: boolean
                required: false
                default: false
            assessment-round-id:
                description: Separately approved assessment round UUID
                type: string
                required: false
                default: ''
            assessment-source-sha:
                description: Reviewed exact current source commit SHA
                type: string
                required: false
                default: ''
            assessment-source-tree:
                description: Reviewed exact current source tree SHA
                type: string
                required: false
                default: ''
    workflow_call:
    schedule:
        -   cron: '17 1 * * 1'

permissions:
    contents: read

concurrency:
    group: ${{ github.event_name == 'workflow_dispatch' && inputs['ubuntu-first-start-assessment'] == true && format('ci-first-start-assessment-{0}-{1}', github.workflow, github.run_id) || github.event_name == 'workflow_dispatch' && (inputs['ubuntu-startup-study'] == true || inputs['ubuntu-readahead-study'] == true) && format('ci-startup-study-{0}-{1}', github.workflow, github.run_id) || format('ci-{0}-{1}', github.workflow, github.ref) }}
    cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs['ubuntu-first-start-assessment'] == true) }}

jobs:
    supply-chain-security:
        name: Supply chain security
        runs-on: ubuntu-latest
        env:
            PNPM_CONFIG_IGNORE_PNPMFILE: "true"
            PNPM_CONFIG_CONFIG_DEPENDENCIES: "{}"
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Validate and audit lockfile before installation
                run: node tooling/security/dist/check-security.mjs --phase lockfile --root .
            -   name: Install without dependency lifecycle scripts
                run: pnpm install --frozen-lockfile --ignore-scripts
            -   name: Check full dependency trees and registry signatures
                run: pnpm check:security
            -   name: Verify standalone security checker matches its source
                run: pnpm check:security:build

    commit-messages:
        name: Commit messages
        needs: supply-chain-security
        runs-on: ubuntu-latest
        steps:
            -   name: Check out full history
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Validate commits, source branch and current PR submission
                run: pnpm check:commits

    quality:
        name: Quality
        needs: supply-chain-security
        runs-on: ubuntu-latest
        steps:
            -   name: Reject conflicting research inputs
                if: github.event_name == 'workflow_dispatch' && ((inputs['ubuntu-startup-study'] == true && inputs['ubuntu-readahead-study'] == true) || (inputs['ubuntu-first-start-assessment'] == true && (inputs['ubuntu-startup-study'] == true || inputs['ubuntu-readahead-study'] == true)))
                shell: bash
                run: |
                    printf 'Select only one Ubuntu research mode.\n' >&2
                    exit 1
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Validate assessment selectors and reviewed source
                env:
                    DCT_ASSESSMENT_ENABLED: ${{ toJSON(inputs['ubuntu-first-start-assessment'] == true) }}
                    DCT_ASSESSMENT_STARTUP_STUDY: ${{ toJSON(inputs['ubuntu-startup-study'] == true) }}
                    DCT_ASSESSMENT_READAHEAD_STUDY: ${{ toJSON(inputs['ubuntu-readahead-study'] == true) }}
                    DCT_ASSESSMENT_ROUND_ID: ${{ inputs['assessment-round-id'] }}
                    DCT_ASSESSMENT_SOURCE_SHA: ${{ inputs['assessment-source-sha'] }}
                    DCT_ASSESSMENT_SOURCE_TREE: ${{ inputs['assessment-source-tree'] }}
                run: node tests/smoke/first-start-assessment-ci.ts quality
            -   name: Audit repository
                run: pnpm check:repo
            -   name: Check formatting
                run: pnpm format:check
            -   name: Lint TypeScript and JSON
                run: pnpm lint
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Check script syntax
                run: pnpm check:scripts
            -   name: Test with coverage floors
                run: pnpm test:coverage
            -   name: Verify distribution
                run: pnpm check:distribution
            -   name: Verify committed runtime build
                run: pnpm check:build

    node-compatibility:
        name: Node compatibility (24.x)
        needs: quality
        runs-on: ubuntu-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up latest Node.js 24
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: '24.x'
                    check-latest: true
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Run default Node test suite
                run: pnpm test
            -   name: Verify committed runtime build
                run: pnpm check:build
            -   name: Verify standalone security checker matches its source
                run: pnpm check:security:build
            -   name: Smoke delivered official Server catalog
                run: pnpm smoke:official

    windows-tests:
        name: Windows tests
        needs: quality
        runs-on: windows-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Run default Node test suite
                run: pnpm test
            -   name: Run interactive Windows test suite
                run: pnpm test:windows:interactive --allow-gui
            -   name: Parse TypeScript, generated JavaScript and both PowerShell parsers
                run: pnpm check:scripts
            -   name: Test from an arbitrary working directory
                shell: pwsh
                run: |
                    $repositoryRoot = (Resolve-Path .).Path
                    Push-Location $env:RUNNER_TEMP
                    try {
                        node --test "$repositoryRoot/tests/plugin-runtime.test.ts"
                    }
                    finally {
                        Pop-Location
                    }
            -   name: Verify distribution
                run: pnpm check:distribution

    portable-tests:
        name: Portable tests (${{ matrix.os }})
        needs: quality
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Run simulated CDP and policy tests
                run: pnpm test

    real-chrome-tests:
        name: Real Chrome (${{ matrix.os }})
        needs: quality
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-24.04
                        chrome: /opt/google/chrome/chrome
                    -   os: macos-15
                        chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        env:
            DCT_SMOKE_CHROME_EXECUTABLE: ${{ matrix.chrome }}
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Initialize current controlled Chrome collection
                id: fixture-initialization
                shell: bash
                run: |
                    set -euo pipefail
                    collectionId=""
                    if collectionId="$(node tests/smoke/fixture-ci.ts init "$RUNNER_TEMP/dct-fixture-diagnostics")"; then
                        printf 'initialized=true\n' >> "$GITHUB_OUTPUT"
                    else
                        printf 'initialized=false\n' >> "$GITHUB_OUTPUT"
                    fi
                    printf 'collection-id=%s\n' "$collectionId" >> "$GITHUB_OUTPUT"
            -   name: Verify Linux desktop Chrome prerequisites and run real acceptance
                if: runner.os == 'Linux'
                shell: bash
                run: |
                    set -euo pipefail
                    collectionId="${{ steps.fixture-initialization.outputs.collection-id }}"
                    test -x "$DCT_SMOKE_CHROME_EXECUTABLE"
                    command -v lsof
                    command -v getconf
                    command -v Xvfb
                    command -v xvfb-run
                    command -v xauth
                    if node tests/smoke/fixture-ci.ts stage "$RUNNER_TEMP/dct-fixture-diagnostics" official-server "$collectionId"; then :; fi
                    captureAdmission='unavailable'
                    if captureAdmission="$(node tests/smoke/first-start-capture-ci.ts)"; then
                        case "$captureAdmission" in
                            admitted) captureAdmission='admitted' ;;
                            ineligible) captureAdmission='ineligible' ;;
                            unavailable) captureAdmission='unavailable' ;;
                            *) captureAdmission='unavailable' ;;
                        esac
                    else
                        captureAdmission='unavailable'
                    fi
                    if [ "$captureAdmission" = 'admitted' ]; then
                        DCT_SMOKE_FIRST_START_CAPTURE_ADMISSION=admitted DCT_SMOKE_FAILED_FIRST_START_CAPTURE=1 xvfb-run -a node tests/smoke/official-server.ts --allow-gui --diagnostics "$RUNNER_TEMP/dct-fixture-diagnostics" --collection-id "$collectionId"
                    elif [ "$captureAdmission" = 'ineligible' ]; then
                        DCT_SMOKE_FIRST_START_CAPTURE_ADMISSION=ineligible xvfb-run -a node tests/smoke/official-server.ts --allow-gui --diagnostics "$RUNNER_TEMP/dct-fixture-diagnostics" --collection-id "$collectionId"
                    else
                        DCT_SMOKE_FIRST_START_CAPTURE_ADMISSION=unavailable xvfb-run -a node tests/smoke/official-server.ts --allow-gui --diagnostics "$RUNNER_TEMP/dct-fixture-diagnostics" --collection-id "$collectionId"
                    fi
                    if node tests/smoke/fixture-ci.ts stage "$RUNNER_TEMP/dct-fixture-diagnostics" entry-recovery "$collectionId"; then :; fi
                    xvfb-run -a node tests/smoke/entry-recovery.ts --allow-gui --diagnostics "$RUNNER_TEMP/dct-fixture-diagnostics" --collection-id "$collectionId"
            -   name: Verify macOS desktop Chrome prerequisites and run real acceptance
                if: runner.os == 'macOS'
                shell: bash
                run: |
                    set -euo pipefail
                    collectionId="${{ steps.fixture-initialization.outputs.collection-id }}"
                    test -x "$DCT_SMOKE_CHROME_EXECUTABLE"
                    command -v lsof
                    if node tests/smoke/fixture-ci.ts stage "$RUNNER_TEMP/dct-fixture-diagnostics" official-server "$collectionId"; then :; fi
                    node tests/smoke/official-server.ts --allow-gui --diagnostics "$RUNNER_TEMP/dct-fixture-diagnostics" --collection-id "$collectionId"
                    if node tests/smoke/fixture-ci.ts stage "$RUNNER_TEMP/dct-fixture-diagnostics" entry-recovery "$collectionId"; then :; fi
                    node tests/smoke/entry-recovery.ts --allow-gui --diagnostics "$RUNNER_TEMP/dct-fixture-diagnostics" --collection-id "$collectionId"
            -   name: Upload controlled Chrome failure diagnostics
                id: fixture-artifact
                if: failure() && steps.fixture-initialization.outputs.initialized == 'true'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: controlled-chrome-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
                    path: |
                        ${{ runner.temp }}/dct-fixture-diagnostics/job-index.json
                        ${{ runner.temp }}/dct-fixture-diagnostics/official-server.events.ndjson
                        ${{ runner.temp }}/dct-fixture-diagnostics/official-server.summary.json
                        ${{ runner.temp }}/dct-fixture-diagnostics/entry-recovery.events.ndjson
                        ${{ runner.temp }}/dct-fixture-diagnostics/entry-recovery.summary.json
                    retention-days: 7
                    include-hidden-files: false
                    overwrite: false
                    if-no-files-found: warn
            -   name: Index controlled Chrome failure diagnostics
                if: failure()
                env:
                    DCT_FIXTURE_ARTIFACT_URL: ${{ steps.fixture-artifact.outputs.artifact-url }}
                run: node tests/smoke/fixture-ci.ts summary "$RUNNER_TEMP/dct-fixture-diagnostics" "${{ steps.fixture-initialization.outputs.collection-id }}"

    ubuntu-startup-study:
        name: Ubuntu startup study (block ${{ matrix.block }}, file logging ${{ matrix.fileLogging }})
        if: github.event_name == 'workflow_dispatch' && inputs['ubuntu-startup-study'] == true && inputs['ubuntu-readahead-study'] != true && inputs['ubuntu-first-start-assessment'] != true
        needs: quality
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                block: [1, 2, 3]
                fileLogging: ['on', 'off']
        env:
            DCT_SMOKE_CHROME_EXECUTABLE: /opt/google/chrome/chrome
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Initialize current controlled Chrome collection
                id: fixture-initialization
                shell: bash
                run: |
                    set -euo pipefail
                    collectionId=""
                    if collectionId="$(node tests/smoke/fixture-ci.ts init "$RUNNER_TEMP/dct-fixture-diagnostics")"; then
                        printf 'initialized=true\n' >> "$GITHUB_OUTPUT"
                    else
                        printf 'initialized=false\n' >> "$GITHUB_OUTPUT"
                    fi
                    printf 'collection-id=%s\n' "$collectionId" >> "$GITHUB_OUTPUT"
            -   name: Run one Ubuntu Chrome startup study sample
                shell: bash
                run: |
                    set -euo pipefail
                    collectionId="${{ steps.fixture-initialization.outputs.collection-id }}"
                    test -x "$DCT_SMOKE_CHROME_EXECUTABLE"
                    command -v lsof
                    command -v getconf
                    command -v Xvfb
                    command -v xvfb-run
                    command -v xauth
                    if node tests/smoke/fixture-ci.ts stage "$RUNNER_TEMP/dct-fixture-diagnostics" official-server "$collectionId"; then :; fi
                    xvfb-run -a node tests/smoke/official-server.ts --allow-gui --startup-study --chrome-file-logging "${{ matrix.fileLogging }}" --diagnostics "$RUNNER_TEMP/dct-fixture-diagnostics" --collection-id "$collectionId"
            -   name: Upload Ubuntu startup study diagnostics
                id: fixture-artifact
                if: always() && steps.fixture-initialization.outputs.initialized == 'true'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ubuntu-startup-study-block-${{ matrix.block }}-logging-${{ matrix.fileLogging }}-${{ github.run_id }}-${{ github.run_attempt }}
                    path: |
                        ${{ runner.temp }}/dct-fixture-diagnostics/job-index.json
                        ${{ runner.temp }}/dct-fixture-diagnostics/official-server.events.ndjson
                        ${{ runner.temp }}/dct-fixture-diagnostics/official-server.summary.json
                        ${{ runner.temp }}/dct-fixture-diagnostics/entry-recovery.events.ndjson
                        ${{ runner.temp }}/dct-fixture-diagnostics/entry-recovery.summary.json
                    retention-days: 7
                    include-hidden-files: false
                    overwrite: false
                    if-no-files-found: warn
            -   name: Index Ubuntu startup study diagnostics
                if: always() && steps.fixture-initialization.outputs.initialized == 'true'
                env:
                    DCT_FIXTURE_ARTIFACT_URL: ${{ steps.fixture-artifact.outputs.artifact-url }}
                run: node tests/smoke/fixture-ci.ts summary "$RUNNER_TEMP/dct-fixture-diagnostics" "${{ steps.fixture-initialization.outputs.collection-id }}"

    ubuntu-readahead-study:
        name: Ubuntu readahead study (slot ${{ matrix.slot }}, block ${{ matrix.block }}, RA ${{ matrix.readaheadKb }} KiB)
        if: github.event_name == 'workflow_dispatch' && inputs['ubuntu-readahead-study'] == true && inputs['ubuntu-startup-study'] != true && inputs['ubuntu-first-start-assessment'] != true
        needs: quality
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   slot: 1
                        block: 1
                        readaheadKb: 128
                    -   slot: 2
                        block: 1
                        readaheadKb: 1024
                    -   slot: 3
                        block: 2
                        readaheadKb: 1024
                    -   slot: 4
                        block: 2
                        readaheadKb: 128
                    -   slot: 5
                        block: 3
                        readaheadKb: 128
                    -   slot: 6
                        block: 3
                        readaheadKb: 1024
        env:
            DCT_SMOKE_CHROME_EXECUTABLE: /opt/google/chrome/chrome
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Initialize current controlled Chrome collection
                id: fixture-initialization
                shell: bash
                run: |
                    set -euo pipefail
                    collectionId=""
                    if collectionId="$(node tests/smoke/fixture-ci.ts init "$RUNNER_TEMP/dct-fixture-diagnostics")"; then
                        printf 'initialized=true\n' >> "$GITHUB_OUTPUT"
                    else
                        printf 'initialized=false\n' >> "$GITHUB_OUTPUT"
                    fi
                    printf 'collection-id=%s\n' "$collectionId" >> "$GITHUB_OUTPUT"
            -   name: Run one Ubuntu Chrome readahead study sample
                shell: bash
                run: |
                    set -euo pipefail
                    collectionId="${{ steps.fixture-initialization.outputs.collection-id }}"
                    test -x "$DCT_SMOKE_CHROME_EXECUTABLE"
                    command -v lsof
                    command -v getconf
                    command -v Xvfb
                    command -v xvfb-run
                    command -v xauth
                    if node tests/smoke/fixture-ci.ts stage "$RUNNER_TEMP/dct-fixture-diagnostics" official-server "$collectionId"; then :; fi
                    xvfb-run -a node tests/smoke/official-server.ts --allow-gui --startup-study --chrome-file-logging on --readahead-kb "${{ matrix.readaheadKb }}" --diagnostics "$RUNNER_TEMP/dct-fixture-diagnostics" --collection-id "$collectionId"
            -   name: Upload Ubuntu readahead study diagnostics
                id: fixture-artifact
                if: always() && steps.fixture-initialization.outputs.initialized == 'true'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ubuntu-readahead-study-slot-${{ matrix.slot }}-block-${{ matrix.block }}-ra-${{ matrix.readaheadKb }}-${{ github.run_id }}-${{ github.run_attempt }}
                    path: |
                        ${{ runner.temp }}/dct-fixture-diagnostics/job-index.json
                        ${{ runner.temp }}/dct-fixture-diagnostics/official-server.events.ndjson
                        ${{ runner.temp }}/dct-fixture-diagnostics/official-server.summary.json
                        ${{ runner.temp }}/dct-fixture-diagnostics/entry-recovery.events.ndjson
                        ${{ runner.temp }}/dct-fixture-diagnostics/entry-recovery.summary.json
                    retention-days: 7
                    include-hidden-files: false
                    overwrite: false
                    if-no-files-found: warn
            -   name: Index Ubuntu readahead study diagnostics
                if: always() && steps.fixture-initialization.outputs.initialized == 'true'
                env:
                    DCT_FIXTURE_ARTIFACT_URL: ${{ steps.fixture-artifact.outputs.artifact-url }}
                run: node tests/smoke/fixture-ci.ts summary "$RUNNER_TEMP/dct-fixture-diagnostics" "${{ steps.fixture-initialization.outputs.collection-id }}"

    ubuntu-first-start-assessment-1:
        name: Ubuntu first-start assessment (slot 1)
        if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs['ubuntu-first-start-assessment'] == true && inputs['ubuntu-startup-study'] != true && inputs['ubuntu-readahead-study'] != true && needs.quality.result == 'success'
        needs: quality
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            safe-to-continue: ${{ steps.assessment.outcome == 'success' && steps.assessment.conclusion == 'success' && steps.pre-upload.outcome == 'success' && steps.pre-upload.conclusion == 'success' && steps.fixture-artifact.outcome == 'success' && steps.fixture-artifact.conclusion == 'success' && steps.fixture-index.outcome == 'success' && steps.fixture-index.conclusion == 'success' && steps.postcheck.outcome == 'success' && steps.postcheck.conclusion == 'success' && steps.postcheck.outputs.safe-to-continue == 'true' && 'true' || 'false' }}
        env:
