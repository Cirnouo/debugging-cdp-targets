name: CI

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize
            - edited
    workflow_dispatch:
    workflow_call:
    schedule:
        -   cron: '17 1 * * 1'

permissions:
    contents: read

concurrency:
    group: ${{ format('ci-{0}-{1}', github.workflow, github.ref) }}
    cancel-in-progress: true

jobs:
    supply-chain-security:
        name: Supply chain security
        runs-on: ubuntu-latest
        env:
            PNPM_CONFIG_IGNORE_PNPMFILE: "true"
            PNPM_CONFIG_CONFIG_DEPENDENCIES: "{}"
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Validate and audit lockfile before installation
                run: node tooling/security/dist/check-security.mjs --phase lockfile --root .
            -   name: Install without dependency lifecycle scripts
                run: pnpm install --frozen-lockfile --ignore-scripts
            -   name: Check full dependency trees and registry signatures
                run: pnpm check:security
            -   name: Verify standalone security checker matches its source
                run: pnpm check:security:build

    commit-messages:
        name: Commit messages
        needs: supply-chain-security
        runs-on: ubuntu-latest
        steps:
            -   name: Check out full history
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Validate commits, source branch and current PR submission
                run: pnpm check:commits

    quality:
        name: Quality
        needs: supply-chain-security
        runs-on: ubuntu-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Audit repository
                run: pnpm check:repo
            -   name: Check formatting
                run: pnpm format:check
            -   name: Lint TypeScript and JSON
                run: pnpm lint
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Check script syntax
                run: pnpm check:scripts
            -   name: Test with coverage floors
                run: pnpm test:coverage
            -   name: Verify distribution
                run: pnpm check:distribution
            -   name: Verify committed runtime build
                run: pnpm check:build
            -   name: Verify App bundle inputs and licenses
                run: pnpm check:app

    node-compatibility:
        name: Node compatibility (24.x)
        needs: quality
        runs-on: ubuntu-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up latest Node.js 24
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: '24.x'
                    check-latest: true
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Run default Node test suite
                run: pnpm test
            -   name: Verify committed runtime build
                run: pnpm check:build
            -   name: Verify standalone security checker matches its source
                run: pnpm check:security:build
            -   name: Verify App bundle inputs and licenses
                run: pnpm check:app
            -   name: Smoke reviewed installed official Server catalog
                run: pnpm smoke:official --installed

    windows-tests:
        name: Windows tests
        needs: quality
        runs-on: windows-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Run default Node test suite
                run: pnpm test
            -   name: Run interactive Windows test suite
                run: pnpm test:windows:interactive --allow-gui
            -   name: Parse TypeScript, generated JavaScript and both PowerShell parsers
                run: pnpm check:scripts
            -   name: Test from an arbitrary working directory
                shell: pwsh
                run: |
                    $repositoryRoot = (Resolve-Path .).Path
                    Push-Location $env:RUNNER_TEMP
                    try {
                        node --test "$repositoryRoot/tests/plugin-runtime.test.ts"
                    }
                    finally {
                        Pop-Location
                    }
            -   name: Verify distribution
                run: pnpm check:distribution

    real-chrome-tests:
        name: Real Chrome (windows-latest)
        needs: quality
        runs-on: windows-latest
        timeout-minutes: 20
        env:
            DCT_SMOKE_CHROME_EXECUTABLE: 'C:/Program Files/Google/Chrome/Application/chrome.exe'
        steps:
            -   name: Check out repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Check TypeScript types
                run: pnpm typecheck
            -   name: Initialize current controlled Chrome collection
                id: fixture-initialization
                shell: pwsh
                run: |
                    $PSNativeCommandUseErrorActionPreference = $false
                    $diagnosticsDirectory = Join-Path $env:RUNNER_TEMP 'dct-fixture-diagnostics'
                    $initializationOutput = node tests/smoke/fixture-ci.ts init "$diagnosticsDirectory"
                    $initializationExitCode = $LASTEXITCODE
                    $collectionId = ($initializationOutput -join "`n").Trim()
                    $initialized = $initializationExitCode -eq 0 -and $collectionId -match '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
                    if (-not $initialized) { $collectionId = '' }
                    "initialized=$($initialized.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
                    "collection-id=$collectionId" >> $env:GITHUB_OUTPUT
                    exit 0
            -   name: Verify configured Windows Chrome prerequisite
                shell: pwsh
                run: |
                    $PSNativeCommandUseErrorActionPreference = $false
                    node --input-type=module -e "import { requireChromeSmokeExecutable } from './tests/smoke/chrome-host.ts'; await requireChromeSmokeExecutable();"
                    $preflightExitCode = $LASTEXITCODE
                    if ($preflightExitCode -ne 0) { exit $preflightExitCode }
            -   name: Run real Chrome official tools acceptance
                shell: pwsh
                env:
                    DCT_FIXTURE_COLLECTION_ID: ${{ steps.fixture-initialization.outputs.collection-id }}
                run: |
                    $PSNativeCommandUseErrorActionPreference = $false
                    $diagnosticsDirectory = Join-Path $env:RUNNER_TEMP 'dct-fixture-diagnostics'
                    $collectionId = $env:DCT_FIXTURE_COLLECTION_ID
                    node tests/smoke/fixture-ci.ts stage "$diagnosticsDirectory" official-server "$collectionId"
                    node tests/smoke/official-server.ts --allow-gui --diagnostics "$diagnosticsDirectory" --collection-id "$collectionId"
                    $smokeExitCode = $LASTEXITCODE
                    if ($smokeExitCode -ne 0) { exit $smokeExitCode }
            -   name: Run real Chrome connection recovery acceptance
                shell: pwsh
                env:
                    DCT_FIXTURE_COLLECTION_ID: ${{ steps.fixture-initialization.outputs.collection-id }}
                run: |
                    $PSNativeCommandUseErrorActionPreference = $false
                    $diagnosticsDirectory = Join-Path $env:RUNNER_TEMP 'dct-fixture-diagnostics'
                    $collectionId = $env:DCT_FIXTURE_COLLECTION_ID
                    node tests/smoke/fixture-ci.ts stage "$diagnosticsDirectory" entry-recovery "$collectionId"
                    node tests/smoke/entry-recovery.ts --allow-gui --diagnostics "$diagnosticsDirectory" --collection-id "$collectionId"
                    $smokeExitCode = $LASTEXITCODE
                    if ($smokeExitCode -ne 0) { exit $smokeExitCode }
            -   name: Upload controlled Chrome failure diagnostics
                id: fixture-artifact
                if: failure() && steps.fixture-initialization.outputs.initialized == 'true'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: controlled-chrome-windows-latest-${{ github.run_id }}-${{ github.run_attempt }}
                    path: |
                        ${{ runner.temp }}/dct-fixture-diagnostics/job-index.json
                        ${{ runner.temp }}/dct-fixture-diagnostics/official-server.events.ndjson
                        ${{ runner.temp }}/dct-fixture-diagnostics/official-server.summary.json
                        ${{ runner.temp }}/dct-fixture-diagnostics/entry-recovery.events.ndjson
                        ${{ runner.temp }}/dct-fixture-diagnostics/entry-recovery.summary.json
                    retention-days: 7
                    include-hidden-files: false
                    overwrite: false
                    if-no-files-found: warn
            -   name: Index controlled Chrome failure diagnostics
                if: failure()
                shell: pwsh
                env:
                    DCT_FIXTURE_COLLECTION_ID: ${{ steps.fixture-initialization.outputs.collection-id }}
                    DCT_FIXTURE_ARTIFACT_URL: ${{ steps.fixture-artifact.outputs.artifact-url }}
                run: |
                    $diagnosticsDirectory = Join-Path $env:RUNNER_TEMP 'dct-fixture-diagnostics'
                    node tests/smoke/fixture-ci.ts summary "$diagnosticsDirectory" "$env:DCT_FIXTURE_COLLECTION_ID"
