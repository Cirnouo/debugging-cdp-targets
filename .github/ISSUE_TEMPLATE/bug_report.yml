name: Bug report
description: Report reproducible unexpected Plugin behavior.
labels:
    - 'template: bug-report'
body:
    -   type: markdown
        attributes:
            value: |
                Report suspected vulnerabilities through the private channel in SECURITY.md.
                Remove tokens, cookies, private page content and personal paths from all examples.
    -   type: input
        id: operating-system
        attributes:
            label: Operating system and version
            placeholder: Windows 11, Ubuntu 24.04, or macOS 15
        validations:
            required: true
    -   type: dropdown
        id: plugin-host
        attributes:
            label: Plugin host
            options:
                - Codex Desktop
                - Codex CLI
                - Claude Code
        validations:
            required: true
    -   type: input
        id: host-version
        attributes:
            label: Host version
            description: Include the Desktop version or the output of codex --version or claude --version.
        validations:
            required: true
    -   type: input
        id: plugin-version
        attributes:
            label: Plugin version or repository commit
        validations:
            required: true
    -   type: input
        id: target-application
        attributes:
            label: Target application and version
            description: Include the browser or application's name, version and relevant CDP option.
        validations:
            required: true
    -   type: textarea
        id: reproduction
        attributes:
            label: Reproduction steps
            description: Include a minimal example using an isolated target and non-sensitive data.
        validations:
            required: true
    -   type: textarea
        id: expected-behavior
        attributes:
            label: Expected behavior
        validations:
            required: true
    -   type: textarea
        id: actual-behavior
        attributes:
            label: Actual behavior
        validations:
            required: true
    -   type: textarea
        id: diagnostics
        attributes:
            label: Redacted errors and additional context
            description: Include relevant error codes and operation phases; remove sensitive data.
